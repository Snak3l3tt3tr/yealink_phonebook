name: yealinkphonebook

services:
  phonebook:
    build: .
    image: yealinkphonebook-phonebook
    ports:
      - "8681:8000"
    volumes:
      - phonebook-data:/data
      - ./frontend:/app/frontend
    environment:
      - DATABASE_URL=sqlite:////data/phonebook.db
    restart: unless-stopped

volumes:
  phonebook-data:
