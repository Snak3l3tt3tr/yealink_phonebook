<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In · Phonebook</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14'%3E☎%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-card">
        <h1>📞 Phonebook</h1>
        <p>Sign in to manage contacts.</p>
        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" value="admin" autocomplete="username" required autofocus>

            <label for="password">Password</label>
            <input type="password" id="password" autocomplete="current-password" required>

            <button type="submit" id="loginBtn">Sign In</button>
        </form>
        <p id="loginStatus" class="status" role="alert" aria-live="polite"></p>
        <p class="default-warning"><strong>First login:</strong> use <code>admin</code> / <code>admin</code>, then change the password immediately.</p>
    </main>
    <script src="login.js"></script>
</body>
</html>
